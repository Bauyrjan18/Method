experiment:
  name: "ciciot2023_rf_vs_lightgbm_benchmark"
  description: "Comparative benchmark of Random Forest and LightGBM for IoT DDoS detection"
  seed: 42

data:
  sample_path: "data/sample/ciciot2023_sample.csv"
  target_column: "label"
  binary_classification: true
  positive_class: "Attack"
  test_size: 0.2
  stratify: false

feature_selection:
  top_10_features:
    - "flow_duration"
    - "Header_Length"
    - "Rate"
    - "Srate"
    - "Tot sum"
    - "Number"
    - "Magnitue"
    - "Radius"
    - "Variance"
    - "ack_count"

models:
  random_forest:
    n_estimators: 100
    max_depth: 15
    random_state: 42
    n_jobs: 1
  lightgbm:
    n_estimators: 100
    max_depth: 6
    num_leaves: 31
    learning_rate: 0.05
    random_state: 42
    n_jobs: 1

benchmark:
  warmup_runs: 3
  iterations: 10
  batch_sizes:
    - 1
    - 16

guardrails:
  f1_min_threshold: 0.95
  max_ram_limit_mb: 256.0
  max_latency_limit_ms: 15.0
  max_cpu_percent: 80.0

output:
  output_dir: "results"
  results_json: "results/benchmark_results.json"
  results_csv: "results/benchmark_results.csv"
  log_file: "results/benchmark.log"
